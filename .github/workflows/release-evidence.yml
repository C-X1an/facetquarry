name: Reference evidence
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Existing reference-host capabilities only; no measurements
        type: choice
        options: [full]
        default: full
        required: true
      concurrency:
        description: Probe only; no reader benchmark
        type: choice
        options: ["1"]
        default: "1"
        required: true
permissions:
  contents: read
concurrency:
  group: reference-evidence
  cancel-in-progress: false
jobs:
  existing-reference-capabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        timeout-minutes: 1
        with:
          persist-credentials: false
      - name: Observe existing KVM, QEMU and boot prerequisites only
        timeout-minutes: 1
        run: python3 scripts/evidence.py --category existing-reference-capabilities --timeout 45 -- python3 scripts/reference_capability_probe.py
      - name: Retain actual capability observations and command receipt
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-capability-${{ github.run_id }}
          path: |
            .local/reference-capability.json
            .local/evidence
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
