name: Reference evidence
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Frozen full matrix or explicitly nonqualifying smoke/diagnostic
        type: choice
        options: [full, smoke, diagnostic]
        default: full
        required: true
      preservation_control:
        description: Deliberately time out packaging to test complete frozen-image recovery (nonqualifying)
        type: boolean
        default: false
        required: true
      codec_control:
        description: Current codec over retained historical full-size data only (nonqualifying; no new benchmark)
        type: boolean
        default: false
        required: true
      capacity_control:
        description: Supported verification capacity only (select smoke and one reader; no scientific full matrix)
        type: boolean
        default: false
        required: true
      concurrency:
        description: Separate fixed-reader profile on the four-vCPU guest
        type: choice
        options: ["1", "4", "16"]
        default: "1"
        required: true
      accounted_base_bytes:
        description: Fresh all-attributable baseline bytes including the global 2GB reserve
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: reference-evidence
  cancel-in-progress: false
jobs:
  reference:
    if: ${{ !inputs.codec_control && !inputs.capacity_control }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      FQ_ACCOUNTED_BASE_BYTES: ${{ inputs.accounted_base_bytes }}
      FQ_BENCH_PROFILE: ${{ inputs.profile }}
      FQ_BENCH_CONCURRENCY: ${{ inputs.concurrency }}
      FQ_PRESERVATION_CONTROL: ${{ inputs.preservation_control }}
      FQ_FILESYSTEM_FREE_FLOOR: "500000000"
    steps:
      - name: Initialize owned paths from the actual runner environment
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "FQ_VOLUME=$RUNNER_TEMP/facetquarry-reference" "FQ_IMAGE=$RUNNER_TEMP/facetquarry-reference.img" "FQ_METADATA_PACKET=$RUNNER_TEMP/facetquarry-metadata-packet" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Establish the admitted 2.3 GB owned filesystem including the failure branch
        id: quota
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          fq_image="$RUNNER_TEMP/facetquarry-reference.img"
          fq_volume="$RUNNER_TEMP/facetquarry-reference"
          mkdir -p "$GITHUB_WORKSPACE/.local"
          python3 - <<'PY'
          import json,os,pathlib,sys
          sys.path.insert(0,'scripts')
          from reference_artifacts import growth_plan
          base=int(os.environ['FQ_ACCOUNTED_BASE_BYTES'])
          assert all(0 < os.statvfs(path).f_frsize <= 4096 for path in (os.environ['GITHUB_WORKSPACE'],os.environ['RUNNER_TEMP'])),'physical metadata reservation requires allocation units no larger than4096bytes'
          assert os.environ['FQ_BENCH_PROFILE'] in ('full','smoke','diagnostic') and os.environ['FQ_BENCH_CONCURRENCY'] in ('1','4','16')
          assert os.environ['FQ_PRESERVATION_CONTROL'] != 'true' or os.environ['FQ_BENCH_PROFILE'] == 'smoke','failure controls require explicitly nonqualifying smoke'
          # Reserve the largest normal or failed-pack branch BEFORE allocation.
          # Bundle, exact image, and bootstrap uploads are mutually exclusive.
          record=growth_plan(base,2300000000)
          (pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'.local/reference-admission.json').write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record));assert record['admission']=='ALLOW','global attribution admission refused'
          PY
          test ! -e "$fq_image" && test ! -e "$fq_volume"
          mkdir "$fq_volume"
          fallocate -l 2300000000 "$fq_image"
          mkfs.ext4 -F -q "$fq_image"
          sudo -n mount -o loop "$fq_image" "$fq_volume"
          sudo -n chown "$(id -u):$(id -g)" "$fq_volume" "$fq_volume/lost+found"
          if fallocate -l 2400000000 "$fq_volume/quota-probe" 2>"$RUNNER_TEMP/facetquarry-reference-enospc.stderr"; then
            echo 'FAIL: oversized allocation was accepted'
            exit 1
          fi
          grep -q 'No space left on device' "$RUNNER_TEMP/facetquarry-reference-enospc.stderr"
          rm -- "$fq_volume/quota-probe"
          cp -a "$GITHUB_WORKSPACE" "$fq_volume/source"
          mkdir -p "$fq_volume/tools" "$fq_volume/config" "$fq_volume/source/.cache/tmp" "$fq_volume/source/.local"
          cp -- "$RUNNER_TEMP/facetquarry-reference-enospc.stderr" "$fq_volume/source/.local/enospc.stderr"
          export FQ_VOLUME="$fq_volume" FQ_IMAGE="$fq_image"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          volume=pathlib.Path(os.environ['FQ_VOLUME']);image=pathlib.Path(os.environ['FQ_IMAGE'])
          mount=json.loads(subprocess.run(['findmnt','--json','--target',str(volume),'-o','TARGET,FSTYPE,SOURCE'],capture_output=True,text=True,check=True).stdout)['filesystems'][0]
          assert mount['target']==str(volume) and mount['fstype']=='ext4' and mount['source'].startswith('/dev/loop')
          assert image.stat().st_size==2300000000
          def git(*args):return subprocess.run(['git','-C',str(volume/'source'),*args],capture_output=True,text=True,check=True).stdout.strip()
          context={'commit':git('rev-parse','HEAD'),'git_status':git('status','--porcelain'),
                   'github_run_id':os.environ['GITHUB_RUN_ID'],'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT']}
          stderr=(volume/'source/.local/enospc.stderr').read_bytes()
          assert context['git_status']=='' and b'No space left on device' in stderr
          record={'schema_version':1,'evidence_type':'reference_quota','hard_quota_enforced':True,
                  'volume_file_bytes':image.stat().st_size,'oversized_allocation_bytes':2400000000,
                  'oversized_allocation':'DENIED_ENOSPC','mount':mount,'volume_path':str(volume),
                  'image_path':str(image),'run_context':context,'enospc_sha256':hashlib.sha256(stderr).hexdigest(),
                  'scope':'Actual ext4 loop-image ceiling; global 2GB reserve and guest RAM filesystems are accounted separately.'}
          (volume/'source/.local/reference-quota.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          printf '%s\n' "FQ_BENCH_PROFILE=$FQ_BENCH_PROFILE" "FQ_BENCH_CONCURRENCY=$FQ_BENCH_CONCURRENCY" "FQ_VOLUME=$fq_volume" "FQ_IMAGE=$fq_image" "FQ_WORKSPACE_ROOT=$fq_volume" "GOTOOLCHAIN=local" "FQ_CPUS=4" "TMPDIR=$fq_volume/source/.cache/tmp" "TEMP=$fq_volume/source/.cache/tmp" "TMP=$fq_volume/source/.cache/tmp" "GOPATH=$fq_volume/gopath" "GOBIN=$fq_volume/tools/bin" "GOCACHE=$fq_volume/source/.cache/go-build" "GOMODCACHE=$fq_volume/source/.cache/go-mod" "GOTMPDIR=$fq_volume/source/.cache/tmp" "XDG_CONFIG_HOME=$fq_volume/config" "XDG_CACHE_HOME=$fq_volume/cache" >> "$GITHUB_ENV"
          printf '%s\n' "$fq_volume/tools/go/bin" "$fq_volume/tools/bin" >> "$GITHUB_PATH"
      - name: Obtain the pinned supported Go archive with official size and hash proof
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile,urllib.request
          root=pathlib.Path(os.environ['FQ_VOLUME'])
          version='go'+(root/'source/.go-version').read_text().strip().removeprefix('go')
          metadata=json.load(urllib.request.urlopen('https://go.dev/dl/?mode=json&include=all',timeout=30))
          item=next(f for release in metadata if release['version']==version for f in release['files'] if f['os']=='linux' and f['arch']=='amd64' and f['kind']=='archive')
          assert 0<item['size']<100_000_000
          path=root/'tools'/item['filename'];count=0;h=hashlib.sha256()
          with urllib.request.urlopen('https://go.dev/dl/'+item['filename'],timeout=90) as response,path.open('xb') as output:
              while chunk:=response.read(1024*1024):
                  count+=len(chunk)
                  if count>item['size']:raise RuntimeError('download exceeds admitted size')
                  h.update(chunk);output.write(chunk)
          assert count==item['size'] and h.hexdigest()==item['sha256']
          with tarfile.open(path) as archive:
              assert sum(m.size for m in archive.getmembers())<1_000_000_000
              archive.extractall(root/'tools',filter='data')
          (root/'source/.local/toolchain-download.json').write_text(json.dumps(item,indent=2)+'\n')
          path.unlink()
          PY
          go version
          go telemetry off
      - name: Supported source, oracle, race, fuzz, mutations, demo and smoke
        id: verify
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          cd "$FQ_VOLUME/source"
          python3 scripts/evidence.py --category supported-reference-verification --requirements AC-001,AC-002,AC-003,AC-004,AC-005,AC-006,AC-007,AC-008,AC-009,AC-010,AC-011,AC-012,AC-014,AC-015,AC-018,AC-020,AC-023,AC-024 --timeout 780 -- make verify
      - name: Clean committed supported-toolchain reproduction
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          cd "$FQ_VOLUME/source"
          python3 scripts/evidence.py --category clean-supported-reference --requirements AC-019 --timeout 300 -- make clean-verify
      - name: Install the pinned current vulnerability scanner inside the volume
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          cd "$FQ_VOLUME/source"
          python3 scripts/evidence.py --category reference-scanner-install --requirements AC-018 --timeout 120 -- go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go version -m "$GOBIN/govulncheck" > .local/govulncheck-build.txt
      - name: Current online vulnerability scan
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          cd "$FQ_VOLUME/source"
          python3 scripts/evidence.py --category current-reference-online-security --requirements AC-018 --timeout 120 -- make security-online
      - name: Preserve fuzz and trim verified regenerable SDK/cache before nested results setup
        id: results
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          cd "$FQ_VOLUME/source"
          python3 scripts/evidence.py --category reference-preflight-trim --requirements AC-020 --timeout 240 -- python3 scripts/reference_preflight.py --volume "$FQ_VOLUME" --project "$FQ_VOLUME/source"
          # This operation relocates .local. Every prior writer must be closed;
          # wrapping setup in evidence.py would strand its active output.
          timeout --signal=TERM --kill-after=10s 100s python3 scripts/reference_results.py setup --volume "$FQ_VOLUME" --project "$FQ_VOLUME/source"
      - name: Measure the frozen profile in the actual declared KVM guest
        id: measurement
        if: ${{ !cancelled() && steps.results.outcome == 'success' }}
        timeout-minutes: 265
        shell: bash
        run: |
          set -euo pipefail
          cd "$FQ_VOLUME/source"
          python3 - <<'PY'
          import hashlib,json,pathlib
          local=pathlib.Path('.local');preflight=local/'preflight-benchmarks'
          preflight.mkdir()
          folders=list((local/'benchmarks').glob('smoke-*'))
          assert len(folders)==1,'expected the completed host verification smoke before guest measurement'
          records=[]
          for folder in folders:
              assert not folder.is_symlink() and folder.resolve().is_relative_to(local.resolve())
              for path in folder.rglob('*'):
                  if path.is_file():records.append({'old_path':path.as_posix(),'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
              folder.rename(preflight/folder.name)
          (local/'reference-preflight-relocation.json').write_text(json.dumps({'scope':'Host verification smoke preserved separately; no inherited guest cells.','files':records},indent=2)+'\n')
          PY
          python3 scripts/evidence.py --category actual-reference-full-benchmark --requirements AC-016,AC-017 --timeout 15840 --progress-file .local/reference-progress.json --progress-seconds 30 -- python3 scripts/reference_guest.py --volume "$FQ_VOLUME" --project "$FQ_VOLUME/source" --mode benchmark --profile "$FQ_BENCH_PROFILE" --concurrency "$FQ_BENCH_CONCURRENCY" --timeout 15120 --setup-max-bytes 800000000
      - name: Quiesce only this execution's positively bound guest units
        id: quiescence
        if: ${{ always() && steps.results.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/evidence.py --category reference-guest-quiescence --requirements AC-020 --timeout 90 -- python3 scripts/reference_results.py quiesce --volume "$FQ_VOLUME" --project "$FQ_VOLUME/source"
      - name: Preserve actual host diagnostics externally before any child-space-dependent copy
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/reference_pipeline.py diagnostics --volume "$FQ_VOLUME"
      - name: Recompute all samples and frozen five-seed intervals
        id: analysis
        if: ${{ !cancelled() && inputs.profile != 'diagnostic' && steps.measurement.outcome == 'success' }}
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          cd "$FQ_VOLUME/source"
          fq_folder="$(python3 -c 'import json;print(json.load(open(".local/reference-guest-result.json"))["benchmark_folder"])')"
          fq_source="$(python3 scripts/common.py)"
          fq_preview=()
          if test "$FQ_BENCH_PROFILE" = smoke; then fq_preview=(--historical-smoke-preview); fi
          python3 scripts/evidence.py --category reference-analysis --requirements AC-016,AC-017 --timeout 330 -- python3 scripts/analyze_reference.py "$fq_folder" --grid benchmarks/grid.json --expected-source "$fq_source" --output .local/reference-analysis "${fq_preview[@]}"
      - name: Validate the complete full-profile execution before packaging
        if: ${{ !cancelled() && inputs.profile == 'full' && steps.analysis.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          cd "$FQ_VOLUME/source"
          python3 scripts/evidence.py --category reference-execution-qualification --requirements AC-016,AC-017 --timeout 90 -- python3 scripts/reference_qualification.py .local/reference-execution.json
      - name: Package complete results with bounded streams and durable failed-attempt receipts
        id: package
        if: ${{ !cancelled() && steps.results.outcome == 'success' && steps.quiescence.outcome == 'success' }}
        # 720s child +150s verification +210s inventory/termination overhead.
        # Exclusive artifact/recovery branches keep the worst full path354min.
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p .local/reference-transport
          fq_source="$(python3 scripts/common.py)"
          fq_commit="$(git rev-parse HEAD)"
          fq_control=()
          fq_deadline=720
          if test "$FQ_PRESERVATION_CONTROL" = true; then fq_control=(--control); fq_deadline=2; fi
          # Packer runs outside evidence.py and outside the measured .local.
          # It records its actual subprocess streams, timeout and cleanup proof.
          python3 scripts/reference_artifacts.py pack --root "$FQ_VOLUME/source" --output "$GITHUB_WORKSPACE/.local/reference-transport/reference-members.tar.xz" --source "$fq_source" --commit "$fq_commit" --run-id "$GITHUB_RUN_ID" --timeout "$fq_deadline" --preset 3 "${fq_control[@]}"
          python3 scripts/evidence.py --category reference-bundle-verification --requirements AC-020 --timeout 150 -- python3 scripts/evidence_bundle.py verify .local/reference-transport/reference-members.tar.xz
      - name: Export complete bounded execution inputs before removing the image
        id: metadata
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/reference_pipeline.py export --volume "$FQ_VOLUME"
      - name: Remove only the owned image after complete external byte verification
        id: retention
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.metadata.outcome == 'success' }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/evidence.py --category reference-owned-retention --requirements AC-020 --timeout 420 -- python3 scripts/reference_retention.py --volume "$FQ_VOLUME" --bundle "$GITHUB_WORKSPACE/.local/reference-transport/reference-members.tar.xz"
      - name: Record every original smoke member for the deliberate packaging failure control
        id: control_originals
        if: ${{ always() && inputs.preservation_control && steps.results.outcome == 'success' && steps.quiescence.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/evidence.py --category reference-image-control-originals --requirements AC-020 --timeout 90 -- python3 scripts/reference_image_control.py prepare --volume "$FQ_VOLUME" --project "$FQ_VOLUME/source"
      - name: Freeze the exact fixed results image after packaging failure
        id: frozen
        if: ${{ always() && steps.results.outcome == 'success' && steps.package.outcome != 'success' && steps.quiescence.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/evidence.py --category reference-results-failure-freeze --requirements AC-020 --timeout 150 -- python3 scripts/reference_results.py freeze --volume "$FQ_VOLUME" --project "$FQ_VOLUME/source"
      - name: Recover every smoke original through the same frozen image mounted read-only
        if: ${{ always() && inputs.preservation_control && steps.control_originals.outcome == 'success' && steps.frozen.outcome == 'success' }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/evidence.py --category reference-image-control-readonly-recovery --requirements AC-020 --timeout 210 -- python3 scripts/reference_image_control.py recover --volume "$FQ_VOLUME" --project "$FQ_VOLUME/source"
      - name: Rescue only original premeasurement evidence when nested setup failed
        id: rescue
        if: ${{ always() && steps.quota.outcome == 'success' && steps.results.outcome != 'success' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/evidence.py --category reference-premeasurement-rescue --requirements AC-020 --timeout 90 -- python3 scripts/reference_results.py rescue --volume "$FQ_VOLUME" --project "$FQ_VOLUME/source"
      - name: Observe final actual image state without changing workload status
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p .local .cache/tmp
          printf '%s\n' "TMPDIR=$GITHUB_WORKSPACE/.cache/tmp" "TEMP=$GITHUB_WORKSPACE/.cache/tmp" "TMP=$GITHUB_WORKSPACE/.cache/tmp" "GOTMPDIR=$GITHUB_WORKSPACE/.cache/tmp" >> "$GITHUB_ENV"
          python3 scripts/reference_pipeline.py state --volume "$FQ_VOLUME"
      - name: Admit diagnostics independently and select at most one complete scientific artifact
        id: artifact_admission
        if: always()
        timeout-minutes: 1
        shell: bash
        env:
          FQ_PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          fq_package=()
          if test "$FQ_PACKAGE_OUTCOME" = success; then fq_package=(--package-ok); fi
          python3 scripts/reference_pipeline.py admit --volume "$FQ_VOLUME" "${fq_package[@]}"
      - name: Create the independent bounded diagnostic packet including failed artifact admission
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/reference_artifacts.py metadata .local "$FQ_METADATA_PACKET"
      - name: Retain diagnostics even when complete scientific preservation is refused
        if: ${{ always() && steps.artifact_admission.outputs.metadata_allowed == 'true' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FQ_METADATA_PACKET }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
      - name: Retain the verified complete bundle
        if: ${{ always() && steps.artifact_admission.outputs.data_allowed == 'true' && steps.artifact_admission.outputs.kind == 'BUNDLE' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.artifact_admission.outputs.path }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Retain the exact unmounted fixed results image after failed packaging
        if: ${{ always() && steps.artifact_admission.outputs.data_allowed == 'true' && steps.artifact_admission.outputs.kind == 'IMAGE' }}
        timeout-minutes: 4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-results-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.artifact_admission.outputs.path }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
      - name: Retain complete original bootstrap when measurement never started
        if: ${{ always() && steps.artifact_admission.outputs.data_allowed == 'true' && steps.artifact_admission.outputs.kind == 'BOOTSTRAP' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-premeasurement-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.artifact_admission.outputs.path }}
            ${{ env.FQ_VOLUME }}/reference-results-rescue.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

  codec:
    name: Historical full-size codec control (nonqualifying)
    if: ${{ inputs.codec_control && !inputs.capacity_control && !inputs.preservation_control }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      FQ_ACCOUNTED_BASE_BYTES: ${{ inputs.accounted_base_bytes }}
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Admit the complete historical codec branch against the fresh global baseline
        id: codec_admission
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/evidence.py --category historical-codec-admission --requirements AC-020 --timeout 40 -- python3 scripts/reference_codec_control.py plan
      - name: Enforce the owned 2GB image and observe actual 2.1GB ENOSPC
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/evidence.py --category historical-codec-quota --requirements AC-020 --timeout 90 -- python3 scripts/reference_codec_control.py quota
      - name: Fetch only the exact authorized historical artifact into the hard quota
        timeout-minutes: 3
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/evidence.py --category historical-codec-input --requirements AC-020 --timeout 150 -- python3 scripts/reference_codec_control.py download
      - name: Recover all 27738 exact original members through the uniform reversible mapping
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/evidence.py --category historical-codec-recovery --requirements AC-020 --timeout 210 -- python3 scripts/reference_codec_control.py recover
      # Codec-only preset6/64MiB experiment:1800s child within1890s wrapper,
      # 34min step;55min total declared steps remain within the60min job.
      # Reference benchmark packaging keeps its separate720s deadline.
      - name: Observe real preset6 full-size packing phases within the 1800-second codec-only deadline
        timeout-minutes: 34
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/evidence.py --category historical-codec-pack --requirements AC-020 --timeout 1890 -- python3 scripts/reference_codec_control.py pack
      - name: Reconstruct and hash every original and synthetic directory without a second raw copy
        id: codec_verification
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/evidence.py --category historical-codec-verify --requirements AC-020 --timeout 210 -- python3 scripts/reference_codec_control.py verify
      - name: Remove only the exact newly packed file after complete original and inode proof
        if: ${{ success() && steps.codec_verification.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/evidence.py --category historical-codec-output-retention --requirements AC-020 --timeout 45 -- python3 scripts/reference_codec_control.py remove-output
      - name: Close only the positively bound owned mount and retain failures
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/evidence.py --category historical-codec-unmount --requirements AC-020 --timeout 45 -- python3 scripts/reference_codec_control.py unmount
      - name: Independently admit a bounded metadata packet after success or heavy-branch refusal
        id: codec_metadata
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reference_codec_control.py metadata
      - name: Retain admitted diagnostics only while existing historical cloud originals stay unchanged
        if: ${{ always() && steps.codec_metadata.outputs.metadata_allowed == 'true' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-codec-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.codec_metadata.outputs.packet_path }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

  conflicting_controls:
    if: ${{ (inputs.codec_control && inputs.preservation_control) || (inputs.capacity_control && (inputs.codec_control || inputs.preservation_control || inputs.profile != 'smoke' || inputs.concurrency != '1')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Refuse conflicting or misleading control selections
        shell: bash
        run: |
          echo 'REFUSE: controls are exclusive; capacity requires smoke and one reader and never runs a scientific matrix.'
          exit 1

  reference_capacity:
    name: Supported verification capacity control (no scientific matrix)
    if: ${{ inputs.capacity_control && !inputs.codec_control && !inputs.preservation_control && inputs.profile == 'smoke' && inputs.concurrency == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FQ_ACCOUNTED_BASE_BYTES: ${{ inputs.accounted_base_bytes }}
      FQ_RESERVATION_PROFILE: supported-verification-capacity-v1
      FQ_FILESYSTEM_FREE_FLOOR: "500000000"
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Admit the separate complete capacity branch before allocation
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/evidence.py --category capacity-admission --requirements AC-020 --timeout 40 -- python3 scripts/reference_capacity.py plan
      - name: Enforce a dedicated executable 2GB image and actual 2.1GB ENOSPC
        id: capacity_quota
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          fq_image="$RUNNER_TEMP/facetquarry-capacity.img"
          fq_volume="$RUNNER_TEMP/facetquarry-capacity"
          test ! -e "$fq_image" && test ! -e "$fq_volume" || exit 1
          test ! -L "$fq_image" && test ! -L "$fq_volume" || exit 1
          mkdir "$fq_volume"
          fallocate -l 2000000000 "$fq_image"
          mkfs.ext4 -F -q "$fq_image"
          sudo -n mount -o loop,nodev,nosuid "$fq_image" "$fq_volume"
          sudo -n chown "$(id -u):$(id -g)" "$fq_volume" "$fq_volume/lost+found"
          if fallocate -l 2100000000 "$fq_volume/quota-probe" 2>"$GITHUB_WORKSPACE/.local/capacity-enospc.stderr"; then
            echo 'FAIL: oversized capacity allocation was accepted'
            exit 1
          fi
          grep -q 'No space left on device' "$GITHUB_WORKSPACE/.local/capacity-enospc.stderr"
          rm -- "$fq_volume/quota-probe"
          cp -a "$GITHUB_WORKSPACE" "$fq_volume/source"
          mkdir -p "$fq_volume/tools" "$fq_volume/config" "$fq_volume/source/.cache/tmp"
          export FQ_VOLUME="$fq_volume" FQ_IMAGE="$fq_image"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          sys.path.insert(0,'scripts')
          from reference_capacity import PROFILE,context
          volume=pathlib.Path(os.environ['FQ_VOLUME']);image=pathlib.Path(os.environ['FQ_IMAGE'])
          def query(args):
              result=subprocess.run(args,capture_output=True,text=True,check=True,timeout=10)
              assert len(result.stdout)+len(result.stderr)<=32768
              return json.loads(result.stdout)
          mount=query(['findmnt','--json','--target',str(volume),'-o','TARGET,FSTYPE,SOURCE'])['filesystems'][0]
          loops=query(['sudo','-n','losetup','--json','--list','--associated',str(image),'--output','NAME,BACK-FILE'])
          info=image.lstat();stderr=(volume/'source/.local/capacity-enospc.stderr').read_bytes()
          assert info.st_size==2000000000 and info.st_nlink==1 and info.st_uid==os.getuid()
          assert mount['target']==str(volume) and mount['fstype']=='ext4'
          assert len(loops['loopdevices'])==1 and loops['loopdevices'][0]['name']==mount['source'] and loops['loopdevices'][0]['back-file']==str(image)
          assert b'No space left on device' in stderr and len(stderr)<=32768
          record={'schema_version':1,'evidence_type':'capacity_quota','profile':PROFILE,
                  'hard_quota_enforced':True,'volume_file_bytes':info.st_size,
                  'oversized_allocation_bytes':2100000000,'oversized_allocation':'DENIED_ENOSPC',
                  'mount':mount,'volume_path':str(volume),'image_path':str(image),'loops':loops,
                  'backing_identity':[info.st_dev,info.st_ino,info.st_mode,info.st_uid,info.st_nlink,info.st_size],
                  'run_context':context(volume/'source'),'enospc_sha256':hashlib.sha256(stderr).hexdigest(),
                  'scope':'Actual fixed ext4 capacity ceiling only; no scientific-workload admission.'}
          for local in (pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'.local',volume/'source/.local'):
              with (local/'capacity-quota.json').open('x') as stream:json.dump(record,stream,indent=2)
          PY
          printf '%s\n' "FQ_VOLUME=$fq_volume" "FQ_IMAGE=$fq_image" "FQ_WORKSPACE_ROOT=$fq_volume" "FQ_CPUS=4" "TMPDIR=$fq_volume/source/.cache/tmp" "TEMP=$fq_volume/source/.cache/tmp" "TMP=$fq_volume/source/.cache/tmp" "GOPATH=$fq_volume/gopath" "GOBIN=$fq_volume/tools/bin" "GOCACHE=$fq_volume/source/.cache/go-build" "GOMODCACHE=$fq_volume/source/.cache/go-mod" "GOTMPDIR=$fq_volume/source/.cache/tmp" "XDG_CONFIG_HOME=$fq_volume/config" "XDG_CACHE_HOME=$fq_volume/cache" >> "$GITHUB_ENV"
          printf '%s\n' "$fq_volume/tools/go/bin" "$fq_volume/tools/bin" >> "$GITHUB_PATH"
          python3 scripts/reference_capacity.py sample --name quota-ready
      - name: Obtain and execute only the pinned official Go toolchain inside the quota
        id: capacity_sdk
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reference_capacity.py sample --name toolchain-before
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tarfile,urllib.request
          root=pathlib.Path(os.environ['FQ_VOLUME'])
          version='go'+(root/'source/.go-version').read_text().strip().removeprefix('go')
          metadata=json.load(urllib.request.urlopen('https://go.dev/dl/?mode=json&include=all',timeout=30))
          item=next(f for release in metadata if release['version']==version for f in release['files'] if f['os']=='linux' and f['arch']=='amd64' and f['kind']=='archive')
          assert 0<item['size']<100_000_000
          path=root/'tools'/item['filename'];count=0;h=hashlib.sha256()
          with urllib.request.urlopen('https://go.dev/dl/'+item['filename'],timeout=90) as response,path.open('xb') as output:
              while chunk:=response.read(1024*1024):
                  count+=len(chunk)
                  if count>item['size']:raise RuntimeError('download exceeds admitted size')
                  h.update(chunk);output.write(chunk)
          assert count==item['size'] and h.hexdigest()==item['sha256']
          with tarfile.open(path) as archive:
              assert sum(m.size for m in archive.getmembers())<1_000_000_000
              archive.extractall(root/'tools',filter='data')
          with (root/'source/.local/toolchain-download.json').open('x') as stream:json.dump(item,stream,indent=2)
          path.unlink()
          actual=subprocess.run(['go','version'],capture_output=True,text=True,check=True,timeout=10).stdout.strip()
          executable=pathlib.Path(subprocess.run(['which','go'],capture_output=True,text=True,check=True,timeout=10).stdout.strip()).resolve()
          assert executable==root/'tools/go/bin/go' and actual.startswith('go version '+version+' ')
          with (root/'source/.local/toolchain-runtime.json').open('x') as stream:json.dump({'version':actual,'executable':str(executable),'uid':os.getuid()},stream,indent=2)
          PY
          go version
          go telemetry off
          python3 scripts/reference_capacity.py sample --name toolchain-ready
      - name: Unchanged supported verification with race fuzz oracle mutations and smoke
        id: capacity_verify
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reference_capacity.py stage --name verify --timeout 780 -- make verify
      - name: Unchanged clean committed supported reproduction
        if: ${{ !cancelled() && steps.capacity_sdk.outcome == 'success' }}
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reference_capacity.py stage --name clean --timeout 300 -- make clean-verify
      - name: Install the pinned scanner inside the capacity image
        id: capacity_scanner
        if: ${{ !cancelled() && steps.capacity_sdk.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reference_capacity.py stage --name scanner-install --timeout 120 -- go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go version -m "$GOBIN/govulncheck" > "$FQ_VOLUME/source/.local/govulncheck-build.txt"
      - name: Unchanged current online vulnerability scan
        if: ${{ !cancelled() && steps.capacity_scanner.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reference_capacity.py stage --name online --timeout 120 -- make security-online
      - name: Capture complete available inner diagnostics after writers close
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          # Export runs outside evidence.py so its own active output is not copied.
          python3 scripts/reference_capacity.py capture
      - name: Close only the positively bound capacity mount including partial setup
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/evidence.py --category capacity-unmount --requirements AC-020 --timeout 45 -- python3 scripts/reference_capacity.py unmount
      - name: Admit and verify the complete bounded capacity diagnostic packet
        id: capacity_packet
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reference_capacity.py packet
      - name: Retain admitted metadata only with explicit failure and completeness state
        if: ${{ always() && steps.capacity_packet.outputs.metadata_allowed == 'true' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supported-capacity-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.capacity_packet.outputs.packet_path }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
