name: Reference evidence

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Packaging only on this auxiliary branch; input must be full
        type: choice
        options: [full]
        default: full
        required: true
      concurrency:
        description: Packaging only; original reader profile1
        type: choice
        options: ["1"]
        default: "1"
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: reference-evidence
  cancel-in-progress: false

jobs:
  package-original-evidence:
    if: ${{ inputs.profile == 'full' && inputs.concurrency == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Establish an actual 2GB owned filesystem quota
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          fq_image="$RUNNER_TEMP/facetquarry-transport.img"
          fq_volume="$RUNNER_TEMP/facetquarry-transport"
          test ! -e "$fq_image"
          test ! -e "$fq_volume"
          mkdir "$fq_volume"
          fallocate -l 2000000000 "$fq_image"
          mkfs.ext4 -F -q "$fq_image"
          sudo mount -o loop "$fq_image" "$fq_volume"
          sudo chown "$(id -u):$(id -g)" "$fq_volume" "$fq_volume/lost+found"
          if fallocate -l 2100000000 "$fq_volume/quota-probe" 2>"$RUNNER_TEMP/facetquarry-transport-quota.stderr"; then
            echo 'FAIL: oversized allocation accepted'
            exit 1
          fi
          grep -q 'No space left on device' "$RUNNER_TEMP/facetquarry-transport-quota.stderr"
          rm -- "$fq_volume/quota-probe"
          cp -a "$GITHUB_WORKSPACE" "$fq_volume/source"
          mkdir -p "$fq_volume/source/.cache/tmp" "$fq_volume/source/.local"
          printf '%s\n' "FQ_VOLUME=$fq_volume" "FQ_IMAGE=$fq_image" "FQ_WORKSPACE_ROOT=$fq_volume" "TMPDIR=$fq_volume/source/.cache/tmp" "TEMP=$fq_volume/source/.cache/tmp" "TMP=$fq_volume/source/.cache/tmp" >> "$GITHUB_ENV"
          printf '%s\n' '{"filesystem_bytes":2000000000,"oversized_allocation_bytes":2100000000,"oversized_allocation":"DENIED_ENOSPC","scope":"packaging only; not benchmark evidence"}' > "$fq_volume/source/.local/transport-quota.json"
      - name: Bounded helper controls
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          cd "$FQ_VOLUME/source"
          python3 scripts/evidence.py --category transport-controls --timeout 60 -- python3 -m unittest discover -s scripts/evidence-transport -p 'test_*.py' -v
      - name: Retrieve frozen original with token-free storage request
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$FQ_VOLUME/source"
          python3 scripts/evidence.py --category frozen-original-download --timeout 240 -- python3 scripts/evidence-transport/download_reference.py "$FQ_VOLUME"
      - name: Analyze original records and preserve exact member recovery
        timeout-minutes: 125
        shell: bash
        run: |
          set -euo pipefail
          cd "$FQ_VOLUME/source"
          sudo systemd-run --quiet --wait --pipe --property=MemoryMax=2G --property=CPUQuota=200% --property=RuntimeMaxSec=7300 --uid="$(id -u)" --gid="$(id -g)" --working-directory="$FQ_VOLUME/source" --setenv="PATH=$PATH" --setenv="FQ_WORKSPACE_ROOT=$FQ_VOLUME" --setenv="TMPDIR=$TMPDIR" --setenv="GITHUB_SHA=$GITHUB_SHA" python3 scripts/evidence.py --category transport-orchestration --timeout 7200 -- python3 scripts/evidence-transport/run_transport.py "$FQ_VOLUME"
      - name: Admit the entire upload set including receipts
        id: admission
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          cd "$FQ_VOLUME/source"
          python3 scripts/evidence-transport/admit_transport_upload.py "$FQ_VOLUME"
      - name: Retain admitted package or explicitly failed diagnostic set
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.admission.outputs.paths }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
