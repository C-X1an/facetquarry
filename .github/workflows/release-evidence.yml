name: Reference evidence
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Environment-only KVM boot and geometry smoke; not the release matrix
        type: choice
        options: [full]
        default: full
        required: true
      concurrency:
        description: Environment smoke only
        type: choice
        options: ["1"]
        default: "1"
        required: true
permissions:
  contents: read
concurrency:
  group: reference-evidence
  cancel-in-progress: false
jobs:
  actual-reference-guest-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Establish a bounded owned environment-smoke filesystem
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          fq_image="$RUNNER_TEMP/facetquarry-guest-smoke.img"
          fq_volume="$RUNNER_TEMP/facetquarry-guest-smoke"
          test ! -e "$fq_image" && test ! -e "$fq_volume"
          mkdir "$fq_volume"
          fallocate -l 2000000000 "$fq_image"
          mkfs.ext4 -F -q "$fq_image"
          sudo -n mount -o loop "$fq_image" "$fq_volume"
          sudo -n chown "$(id -u):$(id -g)" "$fq_volume" "$fq_volume/lost+found"
          if fallocate -l 2100000000 "$fq_volume/quota-probe" 2>"$RUNNER_TEMP/facetquarry-guest-smoke-enospc.stderr"; then
            echo 'FAIL: oversized allocation was accepted'
            exit 1
          fi
          grep -q 'No space left on device' "$RUNNER_TEMP/facetquarry-guest-smoke-enospc.stderr"
          rm -- "$fq_volume/quota-probe"
          cp -a "$GITHUB_WORKSPACE" "$fq_volume/source"
          mkdir -p "$fq_volume/tools" "$fq_volume/config" "$fq_volume/source/.cache/tmp" "$fq_volume/source/.local"
          cp -- "$RUNNER_TEMP/facetquarry-guest-smoke-enospc.stderr" "$fq_volume/source/.local/enospc.stderr"
          printf '%s\n' "FQ_VOLUME=$fq_volume" "FQ_IMAGE=$fq_image" "FQ_WORKSPACE_ROOT=$fq_volume" "GOTOOLCHAIN=local" "FQ_CPUS=4" "TMPDIR=$fq_volume/source/.cache/tmp" "TEMP=$fq_volume/source/.cache/tmp" "TMP=$fq_volume/source/.cache/tmp" "GOPATH=$fq_volume/gopath" "XDG_CONFIG_HOME=$fq_volume/config" "XDG_CACHE_HOME=$fq_volume/cache" >> "$GITHUB_ENV"
          printf '%s\n' "$fq_volume/tools/go/bin" >> "$GITHUB_PATH"
      - name: Obtain the pinned supported Go archive with official size and hash proof
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile,urllib.request
          root=pathlib.Path(os.environ['FQ_VOLUME'])
          version='go'+(root/'source/.go-version').read_text().strip().removeprefix('go')
          metadata=json.load(urllib.request.urlopen('https://go.dev/dl/?mode=json&include=all',timeout=30))
          item=next(f for release in metadata if release['version']==version for f in release['files'] if f['os']=='linux' and f['arch']=='amd64' and f['kind']=='archive')
          assert 0<item['size']<100_000_000
          path=root/'tools'/item['filename'];count=0;h=hashlib.sha256()
          with urllib.request.urlopen('https://go.dev/dl/'+item['filename'],timeout=90) as response,path.open('xb') as output:
              while chunk:=response.read(1024*1024):
                  count+=len(chunk)
                  if count>item['size']:raise RuntimeError('download exceeds admitted size')
                  h.update(chunk);output.write(chunk)
          assert count==item['size'] and h.hexdigest()==item['sha256']
          with tarfile.open(path) as archive:
              assert sum(m.size for m in archive.getmembers())<1_000_000_000
              archive.extractall(root/'tools',filter='data')
          (root/'source/.local/toolchain-download.json').write_text(json.dumps(item,indent=2)+'\n')
          path.unlink()
          PY
          go version
          go telemetry off
      - name: Compile current-source binaries for the environment probe
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          cd "$FQ_VOLUME/source"
          fq_source="$(python3 scripts/common.py)"
          mkdir -p bin
          python3 scripts/evidence.py --category guest-smoke-build --timeout 180 -- go build -trimpath -ldflags "-X main.sourceID=$fq_source" -o bin/facetquarry ./cmd/facetquarry
          python3 scripts/evidence.py --category guest-smoke-build --timeout 120 -- go build -trimpath -ldflags "-X main.sourceID=$fq_source" -o bin/fqbench ./cmd/fqbench
          python3 scripts/evidence.py --category guest-smoke-helper-controls --timeout 30 -- python3 -m unittest discover -s tests -p test_evidence_bundle.py -v
          python3 scripts/evidence.py --category guest-smoke-helper-controls --timeout 30 -- python3 -m unittest discover -s tests -p test_reference_guest.py -v
      - name: Set up and boot the actual bounded reference guest
        timeout-minutes: 17
        shell: bash
        run: |
          set -euo pipefail
          cd "$FQ_VOLUME/source"
          python3 scripts/evidence.py --category actual-reference-guest-environment-smoke --requirements AC-020 --timeout 900 -- python3 scripts/reference_guest.py --volume "$FQ_VOLUME" --project "$FQ_VOLUME/source" --mode smoke --profile full --concurrency 1 --timeout 240 --setup-max-bytes 800000000
      - name: Preserve actual guest and setup diagnostics, including failures
        if: always()
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          if test -d "$FQ_VOLUME/reference-guest"; then
            mkdir -p "$FQ_VOLUME/source/.local/reference-guest-setup"
            find "$FQ_VOLUME/reference-guest" -maxdepth 1 -type f \( -name '*.json' -o -name '*.log' -o -name '*.txt' \) -exec cp -- {} "$FQ_VOLUME/source/.local/reference-guest-setup/" \;
            if test -d "$FQ_VOLUME/reference-guest/commands"; then
              cp -a -- "$FQ_VOLUME/reference-guest/commands" "$FQ_VOLUME/source/.local/reference-guest-setup/commands"
            fi
          fi
          if test -f "$FQ_VOLUME/source/scripts/disk_guard.py"; then
            cd "$FQ_VOLUME/source"
            python3 scripts/disk_guard.py --reserve 100000000 > .local/environment-smoke-inventory.json
          fi
      - name: Retain environment observations and actual receipts
        if: always()
        timeout-minutes: 4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-guest-environment-smoke-${{ github.run_id }}
          path: |
            ${{ env.FQ_VOLUME }}/source/.local/evidence
            ${{ env.FQ_VOLUME }}/source/.local/reference-guest*.json
            ${{ env.FQ_VOLUME }}/source/.local/reference-guest-setup
            ${{ env.FQ_VOLUME }}/source/.local/toolchain-download.json
            ${{ env.FQ_VOLUME }}/source/.local/environment-smoke-inventory.json
            ${{ env.FQ_VOLUME }}/source/.local/enospc.stderr
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
