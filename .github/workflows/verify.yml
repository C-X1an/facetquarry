name: Source verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, resolved 2026-10-23
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6, resolved 2026-10-23
        with:
          go-version-file: .go-version
          cache: false
      - name: Reference toolchain
        run: python3 scripts/bootstrap.py --release
      - name: Source, oracle, race, mutations, demo, smoke benchmark and bounded fuzz
        run: make verify
      - name: Public source audit
        run: python3 scripts/public_audit.py
# This source workflow is not a full-release approval. It does not establish the
# complete benchmark matrix, an independent review, manual owner defence or host quota.
